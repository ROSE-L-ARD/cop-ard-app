[mypy]
python_version = 3.13
warn_unused_configs = True
warn_redundant_casts = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-fsspec.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-rasterio.*]
ignore_missing_imports = True

[mypy-s3fs.*]
ignore_missing_imports = True

[mypy-sarpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

