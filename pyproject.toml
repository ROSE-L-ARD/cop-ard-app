[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cop_ard_app"
authors = [{ name = "B-Open" }]
dynamic = ["version", "description"]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
requires-python = ">=3.13, <3.14"

# By default, the project template does not rely on any specific
# version of the EOPF CPM. The source code examples are validated
# against the latest release.
# Users are encouraged to fix the EOPF CPM version to make sure to
# have a stable build environment.
dependencies = [
    "cop-ard-core",  # TODO pin
    "dask",  # TODO pin
    "distributed>=2026.3.0",
]

[project.optional-dependencies]
tests = ["pytest", "pytest-cov"]
linter = ["ruff"]
typing = [
	"mypy",
	"types-PyYAML",
	"pandas-stubs",
	"types-retry",
	"types-shapely",
    "types-python-dateutil",
    "types-psutil"
]
formatter = ["ruff"]
security = ["bandit"]
doc = [
    "sphinx",
    "numpydoc",
    "sphinxcontrib-mermaid",
    "sphinxcontrib-plantuml",
    "sphinxcontrib-spelling",
    "sphinx-test-reports",
]
complexity = ["xenon"]
doc-cov = ["radon", "docstr-coverage"]
dev = ["ipykernel","matplotlib"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "RUF007",
    "C408",
    "FURB162",
]


[tool.pytest.ini_options]
markers = ["integration", "unit", "need_files"]
[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.uv.sources]
cop-ard-core = { git = "https://github.com/ROSE-L-ARD/cop-ard-core.git" }
